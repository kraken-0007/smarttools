<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>SmartTools - Free Online Tools for PDF, Images & More</title>
    <meta name="description" content="SmartTools — Free online tools for PDF, images, video, audio, text, SEO, developers and more. No sign-up required. Available in English, French and Arabic." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="SmartTools" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />

    <!-- Apple / Mobile -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SmartTools" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Theme & Brand Color -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-TileImage" content="/favicon-48x48.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SmartTools" />
    <meta property="og:title" content="SmartTools - Free Online Tools for PDF, Images & More" />
    <meta property="og:description" content="Convert, compress, edit and optimize files online for free. No sign-up required. Works in your browser." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="https://smartools.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartTools - Free Online Tools" />
    <meta name="twitter:description" content="Convert, compress, edit and optimize files online for free." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Fonts (preconnect + display=swap for non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Canonical (set by useSEO on page change) -->
    <link rel="canonical" href="https://smartools.vercel.app/" />
    <!-- Structured Data: WebSite + Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SmartTools",
      "alternateName": "SmartTools - Free Online Tools",
      "url": "https://smartools.vercel.app/",
      "description": "Free online tools for PDF, images, audio, text and more. No sign-up required.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://smartools.vercel.app/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SmartTools",
      "url": "https://smartools.vercel.app/",
      "logo": "https://smartools.vercel.app/logo.png",
      "description": "SmartTools provides free online tools for PDF, images, audio, text and more."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif">
        <h1>SmartTools - Free Online Tools</h1>
        <p>SmartTools requires JavaScript to run. Please enable JavaScript in your browser.</p>
        <p>SmartTools offers free online tools for PDF conversion, image editing, text utilities and calculators. No sign-up required.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
